name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # No install: under Bun the tests import src/, which needs only built-ins, and an
      # older Bun can't read the lockfile a newer one wrote.
      - run: bun test test/

  # Older Bun runs the SDK, but its node:test is missing (1.1) or partial (1.2), so it
  # gets the smoke script: logging, the console and sending over HTTP.
  bun-old:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun: ["1.1", "1.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun test/smoke.mjs

  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Under Node the tests import the built dist/ (the "#sdk" import in package.json).
      - run: node --test test/*.test.mjs
      - run: node test/smoke.mjs
