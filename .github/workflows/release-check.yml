name: release-check

# Releases are published by hand from the maintainer's laptop (npm publish, with npm's
# two-factor approval). On a vX.Y.Z tag this checks that the tagged code is releasable;
# it never publishes.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: bun run lint && bun run typecheck && bun test test/
      - run: bun --bun run build
      - run: bash scripts/pack-check.sh
